services:
  reltime_node:
    image: hyperledger/besu:26.1.0-pqc
    container_name: "genesis-generator"
    volumes:
      - .:/usr/app/
    user: "${MY_UID}:${MY_GID}"
    command: operator generate-blockchain-config --config-file=/usr/app/qbftConfig.json --to=/usr/app/networkFiles --private-key-file-name=key
