# Valid TOML config file
data-path="/usr/app/data" # Path
# logging="DEBUG"

# Node key algorithm (set by init-qbft.sh --node-dsa); must be the same on every node
node-dsa="SECP256K1"
node-private-key-file="/usr/app/data/key"

tx-pool="sequenced"

# if using layered tx pool, set 2x txAmount in flex-wallet benchmark
# tx-pool-max-future-by-sender="250"

# set 4x txAmount in flex-wallet benchmark
tx-pool-max-size="10000"
tx-pool-limit-by-account-percentage=1.0

rpc-http-enabled=true
rpc-http-api=["ETH","NET","QBFT","VNT"]
rpc-http-cors-origins=["all"]
rpc-http-port=8545

accounts-supported-dsas=["SECP256K1", "SECP256R1", "SECP256K1-MLDSA44", "SECP256K1-FALCON512"]

p2p-host="172.20.0.2"
p2p-port=30303

metrics-enabled=true
metrics-host="0.0.0.0"
metrics-port=9545
host-allowlist=["*"]

genesis-file="/usr/app/genesis.json"

min-gas-price=0
