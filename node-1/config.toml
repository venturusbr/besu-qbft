# Valid TOML config file
data-path="/usr/app/data" # Path

rpc-http-enabled=true
rpc-http-api=["ETH","NET","QBFT"]
rpc-http-cors-origins=["all"]
rpc-http-port=8545

p2p-port=30303

host-allowlist=["*"]

genesis-file="/usr/app/genesis.json"

min-gas-price=0

# Possible values(case sensitive): Dilithium3, SPHINCSPlus, Falcon
pqc-algorithm="Dilithium"
pqc-metrics-file="/usr/app/elapsed_times"